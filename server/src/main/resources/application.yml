server:
  port: 9006
  servlet:
    context-path: /

spring:
  application:
    name: redeploy-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:redeploy}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:redeploy}
    password: ${MYSQL_PASSWORD:redeploy}
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:migration/*.sql
      continue-on-error: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 邮件通道（notification-management 启用 EmailChannel 时填，未启用可留空）
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls.enable: ${SPRING_MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.redeploy.model
  configuration:
    map-underscore-to-camel-case: true

# Re-Deploy Configuration
redeploy:
  # 运维Token（用于Jenkins等自动化场景）
  # 生产部署 MUST 通过 REDEPLOY_ADMIN_TOKEN 覆盖，默认 changeme 仅用于本地调试
  admin-token: ${REDEPLOY_ADMIN_TOKEN:baoshun123}
  # 文件存储路径
  upload-dir: ${REDEPLOY_UPLOAD_DIR:./data/uploads}
  # Agent下载目录
  agent-dir: ${REDEPLOY_AGENT_DIR:./data/agents}
  # 日志保留天数
  log-retention-days: ${REDEPLOY_LOG_RETENTION_DAYS:7}
  # 部署历史保留天数
  history-retention-days: ${REDEPLOY_HISTORY_RETENTION_DAYS:7}
  # SSH加密密钥（Base64编码，16/24/32字节对应AES-128/192/256）
  # 如果留空，启动时会自动生成并打印到日志，请务必保存
  ssh-encryption-key: ${REDEPLOY_SSH_ENCRYPTION_KEY:}
  # 钉钉Webhook配置（已废弃：见 notification-management-and-task-events 变更）
  # 启动时 NotificationConfigMigrator 会读取这段并自动迁移到 notification_config 表。
  # 下一版本移除，请尽快在「通知管理」页面校验并保存。
  dingtalk:
    enabled: ${REDEPLOY_DINGTALK_ENABLED:false}
    webhook-url: ${REDEPLOY_DINGTALK_WEBHOOK_URL:}
    secret: ${REDEPLOY_DINGTALK_SECRET:}
    # 通知模式: failure-only, all
    notify-mode: ${REDEPLOY_DINGTALK_NOTIFY_MODE:failure-only}

  # 通知管理
  notification:
    history-retention-days: ${REDEPLOY_NOTIFICATION_HISTORY_RETENTION_DAYS:30}

  # 远端文件下载
  download:
    # 落盘根目录
    dir: ${REDEPLOY_DOWNLOAD_DIR:./data/downloads}
    # 已成功会话保留天数
    retention-days: ${REDEPLOY_DOWNLOAD_RETENTION_DAYS:30}

logging:
  level:
    root: INFO
    com.redeploy: DEBUG
  file:
    name: ./logs/redeploy-server.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
      total-size-cap: 1GB
